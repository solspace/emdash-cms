packages: []

# EmDash + Freeform example site (Solspace).
#
# Default layout for maintainers (sibling Freeform checkout):
#   ../freeform  → https://github.com/solspace/emdash-freeform
#
# Public clones without a sibling repo should switch package.json deps to:
#   "@solspace/freeform-astro": "^0.1.1"
# and install the Freeform plugin from the EmDash registry (see README).

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3

onlyBuiltDependencies:
  - "esbuild"
  - "workerd"
